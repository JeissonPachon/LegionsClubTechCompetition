{% load static tailwind_tags %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>{% block title %}Legions Club Tech{% endblock title %}</title>
    <link rel="icon" type="image/webp" href="{% static 'img/LegionsClubTech_logo.webp' %}">
    {% tailwind_css %}
    {% block extra_css %}{% endblock %}
</head>

<body class="bg-gray-50 text-black font-serif leading-normal tracking-normal">
    {% include 'header.html' %}

    <main>
        {% block content %}
        {% endblock %}
    </main>

    {% include 'footer.html' %}

    {% block extra_js %}{% endblock %}
</body>
</html>
